name: Sync Renode sources

on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Save proposals without publishing a branch, pull request or issue.
        type: boolean
        default: true

concurrency:
  group: renode-upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      XDG_CACHE_HOME: ${{ github.workspace }}/.tmp/cache
      TMPDIR: ${{ github.workspace }}/.tmp/scratch
    steps:
      # v5.0.1; persisted credentials authenticate the explicitly published sync branch.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Prepare repository cache directories
        run: bash infra/nix/environment.sh
      # v31, matching garmin-toolbox's Nix bootstrap.
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702
        with:
          enable_kvm: false
          extra_nix_config: |
            experimental-features = nix-command flakes
            keep-env-derivations = true
            keep-outputs = true
            max-jobs = 2
            cores = 2
      # v15; retain the sibling repository's GitHub-only Magic Nix Cache setup.
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7
        with:
          use-gha-cache: enabled
          use-flakehub: disabled
          diagnostic-endpoint: ''
      - name: Prepare, validate and optionally publish the update
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash infra/ci/sync.sh
      # v6.0.0
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: always()
        with:
          name: renode-sync
          path: .tmp/sync/artifacts
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
